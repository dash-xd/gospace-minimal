name: Router
description: >-
  Points this shell's router at zero or more composed router packages by
  regenerating internal/routersource/source.go via cmd/genrouter, then
  optionally runs the prepped function.Main locally over plain HTTP
  (cmd/localserve), without the GCP Cloud Functions buildpack/Functions
  Framework. Pair run-local with the run-local-stop action once done with
  it.

inputs:
  mounts:
    description: >-
      Router packages to compose into this deployment's default router,
      one per line, alongside the always-present default route (GET
      /healthz). Each line is "package=prefix", e.g.
      "github.com/dash-xd/github-device-auth/router=/auth", optionally
      followed by "@version" to pin that package's module to a semver
      tag or full commit SHA, e.g.
      "github.com/dash-xd/github-device-auth/router=/auth@v1.2.3".
      Leave a package unpinned to resolve its latest version
      automatically (go mod tidy adds the new import at whatever's
      newest once source.go is regenerated to reference it) — that
      means the tip of the module's default branch for repos with no
      tags yet, so the router package needs to actually be on that
      branch. (Branch names containing "/" aren't accepted as a
      `go get` version query, so pin to a tag or commit SHA if you need
      one of those.) Leave this input empty entirely to reset
      source.go to just the default route with no composed packages
      and no external dependency.
    required: false
    default: ""
  run-local:
    description: >-
      After preparing the router, also start it locally in the
      background and wait for it to accept connections.
    required: false
    default: "false"
  working-directory:
    description: Directory containing this shell's go.mod.
    required: false
    default: "."
  host:
    description: "run-local only: host/interface to bind to."
    required: false
    default: "127.0.0.1"
  port:
    description: "run-local only: port to listen on."
    required: false
    default: "8080"
  ready-path:
    description: >-
      run-local only: path to probe (with a POST) to detect the server
      is up. Any HTTP response counts as ready, even an error status -
      only a connection failure keeps polling - so this doesn't need to
      be a route the prepped router actually implements.
    required: false
    default: "/"
  ready-timeout-seconds:
    description: "run-local only: how long to wait for the server to start accepting connections."
    required: false
    default: "30"

outputs:
  base-url:
    description: >-
      run-local only: base URL the server is listening on, e.g.
      http://127.0.0.1:8080
    value: ${{ steps.start.outputs.base-url }}
  pid-file:
    description: >-
      run-local only: path to a file containing the server's PID, for
      run-local-stop to kill later.
    value: ${{ steps.start.outputs.pid-file }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Regenerate the router source drop-in
      id: mounts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MOUNTS: ${{ inputs.mounts }}
      run: |
        set -euo pipefail

        mount_args=()
        pins=()

        while IFS= read -r line; do
          line="${line%$'\r'}"
          line="$(echo -n "$line" | xargs)"
          [[ -z "$line" ]] && continue

          package_prefix="$line"
          version=""
          if [[ "$line" == *"@"* ]]; then
            package_prefix="${line%%@*}"
            version="${line#*@}"
          fi

          if [[ "$package_prefix" != *"="* ]]; then
            echo "::error::invalid mounts line (want package=prefix[@version]): $line"
            exit 1
          fi

          mount_args+=("-mount=${package_prefix}")

          if [[ -n "$version" ]]; then
            pins+=("${package_prefix%%=*}@${version}")
          fi
        done <<<"$MOUNTS"

        go run ./cmd/genrouter "${mount_args[@]}"

        printf '%s\n' "${pins[@]}" >mounts-pins.txt

    - name: Pin composed packages to their requested versions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOPROXY: direct
      run: |
        set -euo pipefail

        while IFS= read -r pin; do
          [[ -z "$pin" ]] && continue
          go get "$pin"
        done <mounts-pins.txt

        rm -f mounts-pins.txt

    - name: Tidy and verify the shell builds against the composed routers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # GOPROXY=direct: for any unpinned composed package, this tidy is
      # what actually resolves "latest". proxy.golang.org caches that
      # resolution for untagged modules, so a build run shortly after a
      # fresh push can otherwise silently get a stale commit even
      # though the real repo has already moved. Going direct to the
      # VCS host for this step avoids that; GOSUMDB checksum
      # verification still applies since it's keyed by exact version,
      # not by the ambiguous "latest" pointer, so this doesn't weaken
      # that.
      env:
        GOPROXY: ${{ inputs.mounts != '' && 'direct' || '' }}
      run: |
        go mod tidy
        go build ./...

    - name: Start server
      id: start
      if: ${{ inputs.run-local == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        READY_PATH: ${{ inputs.ready-path }}
        READY_TIMEOUT_SECONDS: ${{ inputs.ready-timeout-seconds }}
      run: |
        set -euo pipefail

        go run ./cmd/localserve > localserve.log 2>&1 &
        pid=$!

        pid_file="$(pwd)/localserve.pid"
        echo "$pid" > "$pid_file"

        base_url="http://${HOST}:${PORT}"

        for _ in $(seq 1 "$READY_TIMEOUT_SECONDS"); do
          if curl -s -o /dev/null -X POST "${base_url}${READY_PATH}"; then
            echo "server is up at ${base_url}"
            echo "base-url=${base_url}" >>"$GITHUB_OUTPUT"
            echo "pid-file=${pid_file}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 1
        done

        echo "::error::server never came up on ${base_url}"
        cat localserve.log >&2 || true
        exit 1
