name: Router
description: >-
  Points this shell's router at a custom implementation by overwriting
  internal/routersource/source/source.go before building, then optionally runs
  the prepped function.Main locally over plain HTTP (cmd/localserve),
  without the GCP Cloud Functions buildpack/Functions Framework. Pair
  run-local with the run-local-stop action once done with it. Leave both
  source-file and source-content empty to build the checked-in default
  (a stdlib mux with just a health check) unchanged.

inputs:
  source-file:
    description: >-
      Path (relative to working-directory, or absolute) to a Go file to
      copy over internal/routersource/source/source.go before building. Typical
      use: check out a repo that owns a custom
      internal/routersource/source/source.go
      (composing in whatever router packages it wants, in plain Go) and
      point this at that checkout. Mutually exclusive with
      source-content.
    required: false
    default: ""
  source-content:
    description: >-
      Literal Go source to write to internal/routersource/source/source.go
      before building, for callers that want to inline a small custom
      router instead of checking out a separate file. Mutually exclusive
      with source-file.
    required: false
    default: ""
  run-local:
    description: >-
      After preparing the router, also start it locally in the
      background and wait for it to accept connections.
    required: false
    default: "false"
  working-directory:
    description: Directory containing this shell's go.mod.
    required: false
    default: "."
  host:
    description: "run-local only: host/interface to bind to."
    required: false
    default: "127.0.0.1"
  port:
    description: "run-local only: port to listen on."
    required: false
    default: "8080"
  ready-path:
    description: >-
      run-local only: path to probe (with a POST) to detect the server
      is up. Any HTTP response counts as ready, even an error status -
      only a connection failure keeps polling - so this doesn't need to
      be a route the prepped router actually implements.
    required: false
    default: "/"
  ready-timeout-seconds:
    description: "run-local only: how long to wait for the server to start accepting connections."
    required: false
    default: "30"

outputs:
  base-url:
    description: >-
      run-local only: base URL the server is listening on, e.g.
      http://127.0.0.1:8080
    value: ${{ steps.start.outputs.base-url }}
  pid-file:
    description: >-
      run-local only: path to a file containing the server's PID, for
      run-local-stop to kill later.
    value: ${{ steps.start.outputs.pid-file }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.source-file }}" && -n "${{ inputs.source-content }}" ]]; then
          echo "::error::source-file and source-content are mutually exclusive"
          exit 1
        fi

    - name: Drop in the router source
      if: ${{ inputs.source-file != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cp "${{ inputs.source-file }}" internal/routersource/source/source.go

    - name: Write the router source
      if: ${{ inputs.source-content != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOURCE_CONTENT: ${{ inputs.source-content }}
      run: printf '%s\n' "$SOURCE_CONTENT" >internal/routersource/source/source.go

    - name: Tidy and build localserve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # cmd/localserve pulls in the entire graph this shell builds
      # (function -> routersource/serve -> routersource/source), so
      # building it is also how this step verifies the shell as a
      # whole - there's nothing else to separately go-build.
      #
      # GOPROXY=direct: a dropped-in source.go often imports a package
      # at its latest untagged commit. proxy.golang.org caches that
      # resolution, so a build run shortly after a fresh push can
      # otherwise silently get a stale commit even though the real repo
      # has already moved. Going direct to the VCS host for this step
      # avoids that; GOSUMDB checksum verification still applies since
      # it's keyed by exact version, not by the ambiguous "latest"
      # pointer, so this doesn't weaken that.
      env:
        GOPROXY: ${{ (inputs.source-file != '' || inputs.source-content != '') && 'direct' || '' }}
      run: |
        set -euo pipefail
        go mod tidy
        mkdir -p .tmp/bin
        go build -o .tmp/bin/localserve ./cmd/localserve

    - name: Start server
      id: start
      if: ${{ inputs.run-local == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        READY_PATH: ${{ inputs.ready-path }}
        READY_TIMEOUT_SECONDS: ${{ inputs.ready-timeout-seconds }}
      run: |
        set -euo pipefail

        # The exact binary just built and verified above - not a fresh
        # `go run` compile - is what gets exercised here.
        .tmp/bin/localserve > localserve.log 2>&1 &
        pid=$!

        pid_file="$(pwd)/localserve.pid"
        echo "$pid" > "$pid_file"

        base_url="http://${HOST}:${PORT}"

        for _ in $(seq 1 "$READY_TIMEOUT_SECONDS"); do
          if curl -s -o /dev/null -X POST "${base_url}${READY_PATH}"; then
            echo "server is up at ${base_url}"
            echo "base-url=${base_url}" >>"$GITHUB_OUTPUT"
            echo "pid-file=${pid_file}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 1
        done

        echo "::error::server never came up on ${base_url}"
        cat localserve.log >&2 || true
        exit 1
