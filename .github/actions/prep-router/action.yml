name: Prep router
description: >-
  Points this shell at a specific chi-router-providing Go package by
  regenerating internal/routersource/source.go, the one file main.go's
  import never varies from. Run this before building/deploying the Cloud
  Function.

inputs:
  router-package:
    description: >-
      Import path of the package exposing NewRouter, e.g.
      github.com/dash-xd/github-device-auth/router.
    required: true
  router-version:
    description: >-
      Optional version to pin that package's module to: a semver tag or
      a full commit SHA. Leave unset to resolve the latest version
      automatically (go mod tidy adds the new import at whatever's newest
      once source.go is regenerated to reference it) — that means the
      tip of the module's default branch for repos with no tags yet, so
      the router package needs to actually be on that branch. (Branch
      names containing "/" aren't accepted as a `go get` version query,
      so pin to a tag or commit SHA if you need one of those.)
    required: false
    default: ""
  working-directory:
    description: Directory containing this shell's go.mod.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Regenerate the router source drop-in
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        cat > internal/routersource/source.go <<EOF
        // Code generated by the prep-router action. DO NOT EDIT.
        package routersource

        import (
        	"net/http"

        	router "${{ inputs.router-package }}"
        )

        // NewRouter returns the chi router for this deployment.
        func NewRouter() http.Handler {
        	return router.NewRouter()
        }
        EOF

        gofmt -w internal/routersource/source.go

    - name: Pin go.mod to the requested version
      if: ${{ inputs.router-version != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go get "${{ inputs.router-package }}@${{ inputs.router-version }}"

    - name: Tidy and verify the shell builds against the resolved router
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # GOPROXY=direct: when router-version is unset, this tidy is what
      # actually resolves "latest" for router-package. proxy.golang.org
      # caches that resolution for untagged modules, so a build run
      # shortly after a fresh push can otherwise silently get a stale
      # commit even though the real repo has already moved. Going direct
      # to the VCS host for this step avoids that; GOSUMDB checksum
      # verification still applies since it's keyed by exact version, not
      # by the ambiguous "latest" pointer, so this doesn't weaken that.
      env:
        GOPROXY: direct
      run: |
        go mod tidy
        go build ./...
