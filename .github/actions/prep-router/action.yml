name: Prep router
description: >-
  Points this shell at a specific chi-router-providing Go package and
  version by regenerating internal/routersource/source.go, the one file
  main.go's import never varies from. Run this before building/deploying
  the Cloud Function.

inputs:
  router-package:
    description: >-
      Import path of the package exposing NewRouter, e.g.
      github.com/dash-xd/github-device-auth/router.
    required: true
  router-version:
    description: >-
      Version to pin that package's module to: a semver tag or a full
      commit SHA. (Branch names containing "/" aren't accepted by `go
      get` as a version query — use a tag or commit SHA instead.)
    required: true
  working-directory:
    description: Directory containing this shell's go.mod.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Regenerate the router source drop-in
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        cat > internal/routersource/source.go <<EOF
        // Code generated by the prep-router action. DO NOT EDIT.
        package routersource

        import (
        	"net/http"

        	router "${{ inputs.router-package }}"
        )

        // NewRouter returns the chi router for this deployment.
        func NewRouter() http.Handler {
        	return router.NewRouter()
        }
        EOF

        gofmt -w internal/routersource/source.go

    - name: Point go.mod at the target version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go get "${{ inputs.router-package }}@${{ inputs.router-version }}"

    - name: Tidy and verify the shell builds against the resolved router
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        go mod tidy
        go build ./...
