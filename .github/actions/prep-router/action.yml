name: Prep Router (from a Go import path)
description: >-
  Points this shell's router drop-in at an externally-owned router
  package by Go import path, rather than a checked-out source.go file:
  generates internal/routersource/source/source.go as a thin adapter
  that imports router-package and returns its NewRouter() as an
  http.Handler, optionally pins that module to router-version, then
  delegates to the router action for the tidy/build/run-local mechanics
  shared with the source-file/source-content path. This is how a caller
  like dash-xd/huram-abi's deploy-device-auth-router points this shell
  at dash-xd/github-device-auth's chi router without needing to own or
  check out a repo-specific source.go of its own.

inputs:
  router-package:
    description: >-
      Go import path of the package exposing NewRouter(). NewRouter's
      declared return type just needs to satisfy http.Handler (e.g.
      *chi.Mux does) - the generated adapter wraps it in a function
      literal declared to return http.Handler, which is what makes the
      assignment to routersource/serve's RouterFactory type-check
      regardless of NewRouter's own concrete return type.
    required: true
  router-version:
    description: >-
      Optional semver tag or full commit SHA of router-package's module
      to pin via `go get`. Leave blank to let `go mod tidy` resolve
      whatever's newest on the module's default branch.
    required: false
    default: ""
  build:
    description: >-
      Passed through to the router action: build .tmp/bin/localserve
      after preparing the router. Set to "false" for a target that
      builds from source itself (e.g. Cloud Functions Gen 2's
      buildpack) and only needs the router dropped in.
    required: false
    default: "true"
  run-local:
    description: >-
      Passed through to the router action: after preparing the router,
      also start it locally in the background and wait for it to accept
      connections.
    required: false
    default: "false"
  working-directory:
    description: Directory containing this shell's go.mod.
    required: false
    default: "."
  host:
    description: "run-local only: host/interface to bind to."
    required: false
    default: "127.0.0.1"
  port:
    description: "run-local only: port to listen on."
    required: false
    default: "8080"
  ready-path:
    description: "run-local only: path to probe (with a POST) to detect the server is up."
    required: false
    default: "/"
  ready-timeout-seconds:
    description: "run-local only: how long to wait for the server to start accepting connections."
    required: false
    default: "30"

outputs:
  base-url:
    description: "run-local only: base URL the server is listening on."
    value: ${{ steps.router.outputs.base-url }}
  pid-file:
    description: "run-local only: path to a file containing the server's PID."
    value: ${{ steps.router.outputs.pid-file }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Generate the router adapter for router-package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ROUTER_PACKAGE: ${{ inputs.router-package }}
      # This adapter is written to a scratch file rather than straight
      # into internal/routersource/source/source.go, because the next
      # "go get" step (when router-version is pinned) needs a
      # compilable module *before* the drop-in happens - go get resolves
      # against whatever's currently in go.mod/go.sum, and swapping in an
      # import the module graph doesn't know about yet would make that
      # resolution itself the thing that's broken. The router action
      # (invoked below via source-file) is what actually copies this
      # into place and re-tidies.
      run: |
        set -euo pipefail
        cat > .tmp-prep-router-source.go <<EOF
        // Code generated by gospace-minimal's prep-router action from
        // router-package=${ROUTER_PACKAGE}. Do not edit directly - a
        // subsequent prep-router run overwrites it.
        package source

        import (
        	"net/http"

        	router "${ROUTER_PACKAGE}"
        )

        // NewRouter returns the router for this deployment, sourced from
        // ${ROUTER_PACKAGE}. Declaring the return type as http.Handler
        // here (rather than letting Go infer router.NewRouter's own
        // concrete return type) is what makes this satisfy
        // routersource/serve's RouterFactory function type regardless of
        // what router.NewRouter actually returns.
        func NewRouter() http.Handler {
        	return router.NewRouter()
        }
        EOF

    - name: Pin router-package to router-version
      if: ${{ inputs.router-version != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # GOPROXY=direct for the same reason as the router action's own
      # tidy step: proxy.golang.org can otherwise serve a stale
      # resolution for a version/commit that only just became
      # resolvable.
      env:
        GOPROXY: direct
      run: go get "${{ inputs.router-package }}@${{ inputs.router-version }}"

    # Fully qualified rather than a local `./.github/actions/router`
    # reference: a local relative `uses:` always resolves against
    # GITHUB_WORKSPACE - the *calling workflow's* checkout - not against
    # the repo that hosts the composite action currently running. When a
    # caller like huram-abi's deploy-device-auth-router invokes this
    # action via `dash-xd/gospace-minimal/.github/actions/prep-router@main`,
    # GITHUB_WORKSPACE is huram-abi's own checkout, which has no
    # .github/actions/router at all - a local reference here fails with
    # "Can't find 'action.yml' ... under .../huram-abi/.github/actions/router".
    # Pinned to @main for the same reason deploy-device-auth-router pins
    # its own reference to this action: a composite step's `uses:`
    # doesn't support the inputs context, so it can't be tied to
    # whatever ref prep-router itself was invoked at.
    - name: Drop in the generated adapter and build/run via the router action
      id: router
      uses: dash-xd/gospace-minimal/.github/actions/router@main
      with:
        source-file: .tmp-prep-router-source.go
        build: ${{ inputs.build }}
        run-local: ${{ inputs.run-local }}
        working-directory: ${{ inputs.working-directory }}
        host: ${{ inputs.host }}
        port: ${{ inputs.port }}
        ready-path: ${{ inputs.ready-path }}
        ready-timeout-seconds: ${{ inputs.ready-timeout-seconds }}
