name: Deploy to Cloud Functions Gen 2

# This repo has no Workload Identity Federation trust relationship of
# its own. This is a reusable workflow so a repo that *does* have one
# can call it - the OIDC token minted for the `google-github-actions/auth`
# step below is attributed to the caller (via its job_workflow_ref), so
# the WIF provider's attribute condition should match the caller's repo,
# not dash-xd/gospace-minimal. The caller is responsible for granting
# `permissions: id-token: write` on the job that calls this workflow.
#
# Because the caller's repo isn't necessarily this one, actions/checkout
# below explicitly checks out dash-xd/gospace-minimal at
# github.workflow_sha - the commit that defines *this* workflow file -
# rather than relying on the default (which would check out the
# caller's own repo instead).
#
# No Terraform: `gcloud functions deploy --source` already stages and
# uploads a local directory itself, which is all this needs - adding
# Terraform on top would only be there to shell out to the same gcloud
# command (there's no Terraform resource that accepts a local source
# path), so it'd be a dependency buying nothing.
on:
  workflow_call:
    inputs:
      workload_identity_provider:
        description: >-
          Full resource name of the WIF provider trusting the calling
          repo, e.g.
          projects/123/locations/global/workloadIdentityPools/pool/providers/provider.
        type: string
        required: true
      service_account:
        description: Email of the GCP service account to impersonate via WIF.
        type: string
        required: true
      project_id:
        description: GCP project to deploy into.
        type: string
        required: true
      region:
        description: GCP region for the function.
        type: string
        default: us-central1
      function_name:
        description: >-
          Name of the Cloud Function (2nd gen) to create. This workflow
          keeps no record of past deploys, so a name already in use in
          the project fails the deploy (see the conflict check below)
          instead of updating it - pick a name you know is free, or one
          meant to be unique per deploy.
        type: string
        required: true
      entry_point:
        description: Exported function/handler name the buildpack invokes.
        type: string
        default: Main
      entry_point_dir:
        description: >-
          Path, relative to the repo root, of the package containing
          entry_point - passed to the buildpack via the
          GOOGLE_FUNCTION_SOURCE build environment variable, since the
          entry point lives under internal/ rather than at the module
          root.
        type: string
        default: internal/function
      runtime:
        description: Cloud Functions Go runtime to build with.
        type: string
        default: go122
      service_account_email:
        description: >-
          Runtime service account for the deployed function. Empty uses
          the project's default compute service account.
        type: string
        default: ""
      max_instance_count:
        description: Maximum concurrent instances.
        type: string
        default: "1"
      available_memory:
        description: Memory allotted per instance, e.g. "256Mi".
        type: string
        default: 256Mi
      timeout_seconds:
        description: Per-request timeout, in seconds.
        type: string
        default: "60"
      ingress_settings:
        description: One of ALLOW_ALL, ALLOW_INTERNAL_ONLY, ALLOW_INTERNAL_AND_GCLB.
        type: string
        default: ALLOW_ALL
      allow_unauthenticated:
        description: Grant public (unauthenticated) invocation.
        type: boolean
        default: false
      source-file:
        description: >-
          Passed through to the router action: path (within the
          gospace-minimal checkout) to a custom
          internal/routersource/source/source.go to drop in before
          deploying. Mutually exclusive with source-content.
        type: string
        default: ""
      source-content:
        description: >-
          Passed through to the router action: inline Go source to drop
          in before deploying. Mutually exclusive with source-file.
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gospace-minimal
        uses: actions/checkout@v4
        with:
          repository: dash-xd/gospace-minimal
          ref: ${{ github.workflow_sha }}

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare the router source
        uses: ./.github/actions/router
        with:
          source-file: ${{ inputs.source-file }}
          source-content: ${{ inputs.source-content }}
          build: "false"

      - name: Deploy
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          REGION: ${{ inputs.region }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          ENTRY_POINT_DIR: ${{ inputs.entry_point_dir }}
          RUNTIME: ${{ inputs.runtime }}
          SERVICE_ACCOUNT_EMAIL: ${{ inputs.service_account_email }}
          MAX_INSTANCE_COUNT: ${{ inputs.max_instance_count }}
          AVAILABLE_MEMORY: ${{ inputs.available_memory }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          INGRESS_SETTINGS: ${{ inputs.ingress_settings }}
          ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
        run: |
          set -euo pipefail

          # This workflow keeps no record of past deploys, so it can't
          # tell "already deployed, update it" from "never deployed,
          # create it" the way a normal `gcloud functions deploy`
          # re-run would - deploy is inherently an upsert. Check first
          # and fail outright on a name already in use, rather than
          # silently reconciling it.
          if gcloud functions describe "$FUNCTION_NAME" --gen2 \
              --project="$PROJECT_ID" --region="$REGION" \
              >/dev/null 2>&1; then
            echo "::error::function '$FUNCTION_NAME' already exists in $PROJECT_ID/$REGION - this workflow only ever creates a function, never updates one. Deploy under a name that's free, or delete the existing function first."
            exit 1
          fi

          allow_flag="--no-allow-unauthenticated"
          if [[ "$ALLOW_UNAUTHENTICATED" == "true" ]]; then
            allow_flag="--allow-unauthenticated"
          fi

          service_account_flag=()
          if [[ -n "$SERVICE_ACCOUNT_EMAIL" ]]; then
            service_account_flag=(--service-account="$SERVICE_ACCOUNT_EMAIL")
          fi

          gcloud functions deploy "$FUNCTION_NAME" --gen2 --quiet \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --runtime="$RUNTIME" \
            --entry-point="$ENTRY_POINT" \
            --source=. \
            --set-build-env-vars="GOOGLE_FUNCTION_SOURCE=$ENTRY_POINT_DIR" \
            --trigger-http \
            --max-instances="$MAX_INSTANCE_COUNT" \
            --memory="$AVAILABLE_MEMORY" \
            --timeout="$TIMEOUT_SECONDS" \
            --ingress-settings="$INGRESS_SETTINGS" \
            "$allow_flag" \
            "${service_account_flag[@]}"
